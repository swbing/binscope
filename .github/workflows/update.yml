name: 지원사업 데이터 자동 갱신

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 (한국시간) = UTC 21:00
  workflow_dispatch: {}     # GitHub에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 공고 수집 (grants-data.js 생성)
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
          KSTARTUP_KEY: ${{ secrets.KSTARTUP_KEY }}
        run: python collect.py

      - name: 변경사항 커밋·푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grants-data.js grant_summaries.json
          git diff --staged --quiet || git commit -m "데이터 자동 갱신"
          git push
